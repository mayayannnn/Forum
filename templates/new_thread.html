{% extends "base.html" %}

{% block title %}新規スレッド作成 - 掲示板{% endblock %}

{% block content %}
<div class="new-thread">
    <h2>新規スレッド作成</h2>
    
    <form method="POST" action="{{url_for('new_thread')}}" class="thread-form">
        <div class="form-group">
            <label for="title">スレッドタイトル:</label>
            <input type="text" id="title" name="title" required maxlength="200" placeholder="スレッドのタイトルを入力">
        </div>
        <div class="form-group">
            <label for="name">名前:</label>
            <input type="text" id="name" name="name" required maxlength="100" placeholder="あなたの名前">
        </div>
        <div class="form-group">
            <label for="content">最初の投稿:</label>
            <textarea id="content" name="content" rows="8" required placeholder="最初の投稿内容を入力"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">スレッドを作成</button>
            <a href="/" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
